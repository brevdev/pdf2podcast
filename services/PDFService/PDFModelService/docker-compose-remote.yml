services:
  pdf-api:
    image: nvcr.io/pfteb4cqjzrs/playground/pdf-model-api:${VERSION}
    ports:
      - "8083:8003"
    environment:
      - CELERY_BROKER_URL=redis://redis:6380/0
      - CELERY_RESULT_BACKEND=redis://redis:6380/0
      - REDIS_HOST=redis
      - REDIS_PORT=6380
      - TEMP_FILE_DIR=/tmp/pdf_conversions
      - CUDA_VISIBLE_DEVICES=6,7
    volumes:
      - pdf_temp:/tmp/pdf_conversions
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    depends_on:
      - redis
      - celery-worker
    restart: unless-stopped
    networks:
      - app-network

  celery-worker:
    image: nvcr.io/pfteb4cqjzrs/playground/pdf-model-worker:${VERSION}
    environment:
      - CELERY_BROKER_URL=redis://redis:6380/0
      - CELERY_RESULT_BACKEND=redis://redis:6380/0
      - TEMP_FILE_DIR=/tmp/pdf_conversions
      - CUDA_VISIBLE_DEVICES=6,7
    volumes:
      - pdf_temp:/tmp/pdf_conversions
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:alpine
    ports:
      - "6380:6380"
    volumes:
      - redis_data:/data
    command: redis-server --port 6380 --appendonly yes
    restart: unless-stopped
    networks:
      - app-network

volumes:
  redis_data:
  pdf_temp:

networks:
  app-network:
    external: true
