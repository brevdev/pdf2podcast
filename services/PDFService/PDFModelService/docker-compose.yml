services:
  pdf-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8083:8083"
    environment:
      - CELERY_BROKER_URL=redis://redis:6380/0
      - CELERY_RESULT_BACKEND=redis://redis:6380/0
      - REDIS_HOST=redis
      - REDIS_PORT=6380
      - TEMP_FILE_DIR=/tmp/pdf_conversions
      - CUDA_VISIBLE_DEVICES=6,7
    volumes:
      - pdf_temp:/tmp/pdf_conversions
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    depends_on:
      - redis
      - celery-worker
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - CELERY_BROKER_URL=redis://redis:6380/0
      - CELERY_RESULT_BACKEND=redis://redis:6380/0
      - TEMP_FILE_DIR=/tmp/pdf_conversions
      - CUDA_VISIBLE_DEVICES=6,7
    volumes:
      - pdf_temp:/tmp/pdf_conversions
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6380:6380"
    volumes:
      - redis_data:/data
    command: redis-server --port 6380 --appendonly yes
    restart: unless-stopped

volumes:
  redis_data:
  pdf_temp: